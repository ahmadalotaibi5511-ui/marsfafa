<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mars Community</title>

<style>
:root{
  --site-bg:url("https://media.discordapp.net/attachments/1348444582072815736/1403823522106703893/Mars-Planet-Rotation.webp?ex=69fc4049&is=69faeec9&hm=954431e5f9c96b9aaa1390a9bdb0b2aaac601b056f6ad21d773bc2b6959a661b&=&animated=true&width=1121&height=630");
  
  /* 🟠 اللون الجديد */
  --main:#ff6a00;

  --overlay:rgba(0,0,0,0.55);
}

body{
margin:0;
font-family:Arial;
background:var(--site-bg) center/cover no-repeat fixed;
color:white;
position:relative;
}

body::before{
content:'';
position:fixed;
inset:0;
background:var(--overlay);
z-index:0;
}

nav{
position:fixed;
top:0;
width:100%;
background:#111;
display:flex;
justify-content:center;
gap:10px;
padding:12px;
z-index:999;
}

nav a{
color:white;
text-decoration:none;
padding:8px 15px;
background:#222;
border-radius:8px;
cursor:pointer;
}

section{
padding:100px 20px;
display:none;
min-height:100vh;
position:relative;
z-index:1;
}

.active{display:block;}

.flex{
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
}

.card{
background:rgba(0,0,0,0.6);
padding:15px;
border-radius:12px;
width:220px;
text-align:center;
border:1px solid rgba(255,106,0,0.3);
}

.card img{
width:90px;
height:90px;
border-radius:50%;
object-fit:cover;
}

.banner{
width:100%;
height:200px;
background:rgba(255,255,255,0.05);
border-radius:15px;
margin:20px 0;
}

button{
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
background:var(--main);
color:white;
margin:5px;
}

input{
padding:10px;
border-radius:8px;
border:none;
margin:5px;
width:200px;
}

.post{
background:rgba(0,0,0,0.6);
margin:8px 0;
padding:10px;
border-radius:10px;
}

.post b{color:var(--main);}

#chatBox{
max-width:600px;
margin:auto;
}
</style>
</head>

<body>

<nav>
<a onclick="show('home')">الرئيسية</a>
<a onclick="show('store')">المتجر</a>
<a onclick="show('chat')">الشات</a>
<a onclick="show('admin')">الإدارة</a>
</nav>

<div id="loginBox" style="
position:fixed;inset:0;background:#000;
display:flex;flex-direction:column;
justify-content:center;align-items:center;
z-index:9999;
">
<h2>اختر اسم مستخدم</h2>
<input id="setUser" placeholder="اسم المستخدم">
<button onclick="saveUser()">دخول</button>
</div>

<section id="home" class="active">

<h1 style="text-align:center;color:var(--main);">Mars Community</h1>

<p style="text-align:center;">
المستخدم: <span id="currentUser"></span>
</p>

<div class="banner"></div>

<!-- 🔥 زر الدسكورد -->
<div style="text-align:center;">
<button onclick="joinDiscord()">انضم إلى الدسكورد</button>
</div>

<h2 style="text-align:center;">المسؤولين</h2>

<div class="flex">

<div class="card">
<img src="https://cdn.discordapp.com/attachments/1490113151599903003/1501548429443207258/IMG_7286.jpg?ex=69fc7973&is=69fb27f3&hm=6ab524b438d7fcee8fb71459e69d71d4a8585cc82014bc0aed493810b37a146e&">
<h3>Fafa</h3>
<p>Owner</p>
</div>

<div class="card">
<img src="https://media.discordapp.net/attachments/1490113151599903003/1501548429120372777/IMG_7381.jpg?ex=69fc7972&is=69fb27f2&hm=6942066ce6bca7b5936e89fb61815fd6e06abf2bc6873af3f2081e819c34dd48&=&format=webp&width=597&height=630">
<h3>Eleven</h3>
<p>Developer</p>
</div>

</div>

</section>

<section id="store">

<h2 style="text-align:center;color:var(--main);">المتجر</h2>

<div class="flex">

<div class="card">
<h3>رتبة ماثيو</h3>
<p>10000 Credit</p>
<button onclick="order('رتبة ماثيو')">طلب عبر الدسكورد</button>
</div>

<div class="card">
<h3>كافح المكافح</h3>
<p>10000 Credit</p>
<button onclick="order('كافح المكافح')">طلب عبر الدسكورد</button>
</div>

</div>

</section>

<section id="chat">

<h2 style="text-align:center;color:var(--main);">الشات</h2>

<div id="chatBox"></div>

<div style="text-align:center;">
<input id="msg" placeholder="اكتب رسالة">
<button onclick="send()">إرسال</button>
</div>

</section>

<section id="admin">

<h2 style="text-align:center;color:var(--main);">لوحة الإدارة</h2>

<div style="text-align:center;">

<input id="target" placeholder="اسم المستخدم">
<input id="pass" placeholder="كلمة السر">

<br>

<button onclick="ban()">Ban</button>
<button onclick="timeout()">Timeout 60s</button>
<button onclick="clearChat()">مسح الشات</button>

<p id="status"></p>

</div>

</section>

<script>

const PASS="fafa123";

/* تسجيل */
function saveUser(){
let u=document.getElementById("setUser").value;
if(!u) return;

localStorage.setItem("user",u);
document.getElementById("loginBox").style.display="none";
document.getElementById("currentUser").innerText=u;
}

window.onload=function(){
let u=localStorage.getItem("user");

if(u){
document.getElementById("loginBox").style.display="none";
document.getElementById("currentUser").innerText=u;
}

document.getElementById("chatBox").innerHTML=localStorage.getItem("chat")||"";
}

/* تنقل */
function show(id){
document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* 🔥 زر الدسكورد */
function joinDiscord(){
window.open("https://discord.gg/9GrVAxB7xY","_blank");
}

/* طلب */
function order(item){
window.open("https://discord.gg/9GrVAxB7xY","_blank");
alert("تم طلب: "+item);
}

/* شات */
function send(){

let user=localStorage.getItem("user");
let msg=document.getElementById("msg").value;
if(!msg) return;

let box=document.getElementById("chatBox");

let div=document.createElement("div");
div.className="post";
div.innerHTML="<b>"+user+":</b> "+msg;

box.appendChild(div);

localStorage.setItem("chat",box.innerHTML);

document.getElementById("msg").value="";
}

/* Ban */
function ban(){
let u=document.getElementById("target").value;
let p=document.getElementById("pass").value;
if(p!==PASS)return alert("خطأ");

let b=JSON.parse(localStorage.getItem("ban")||"[]");
if(!b.includes(u)) b.push(u);

localStorage.setItem("ban",JSON.stringify(b));

document.getElementById("status").innerText="Ban: "+u;
}

/* Timeout */
function timeout(){
let u=document.getElementById("target").value;
let p=document.getElementById("pass").value;
if(p!==PASS)return alert("خطأ");

let t=JSON.parse(localStorage.getItem("timeout")||"{}");
t[u]=Date.now()+60000;

localStorage.setItem("timeout",JSON.stringify(t));

document.getElementById("status").innerText="Timeout: "+u;
}

/* مسح */
function clearChat(){
let p=document.getElementById("pass").value;
if(p!==PASS)return alert("خطأ");

localStorage.removeItem("chat");
document.getElementById("chatBox").innerHTML="";
}

</script>

</body>
</html>
